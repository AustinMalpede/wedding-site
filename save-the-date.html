<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save the Date · Rachel &amp; Austin · July 10, 2027</title>
<meta name="description" content="Save the date! Rachel Odin & Austin Malpede are getting married July 10, 2027 in Cincinnati, Ohio." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --hot-pink: #e2337a;
    --pink-deep: #c81f63;
    --blush: #f7b8cb;
    --blush-soft: #fde4ec;
    --orange: #f2763a;
    --coral: #f59a6b;
    --gold: #d8b25a;
    --cream: #fdf9f3;
    --ink: #7a2a44;
    --display: "Italiana", serif;
    --script: "Pinyon Script", cursive;
    --serif: "Cormorant Garamond", serif;
    --caps: "Montserrat", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--serif); color: var(--ink); font-size: 19px; line-height: 1.6;
    min-height: 100vh; overflow-x: hidden;
    background: radial-gradient(circle at 25% 15%, #ff6fa3 0%, var(--hot-pink) 45%, var(--pink-deep) 100%);
  }
  body.locked { overflow: hidden; }
  .caps {
    font-family: var(--caps); text-transform: uppercase; letter-spacing: .28em;
    font-size: .68rem; font-weight: 500; color: var(--orange);
  }
  .script { font-family: var(--script); color: var(--hot-pink); }
  .display { font-family: var(--display); color: var(--hot-pink); letter-spacing: .04em; }

  /* ---------- Envelope intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 20%, #ff6fa3 0%, var(--hot-pink) 45%, var(--pink-deep) 100%);
    transition: opacity 1s ease 1.6s, visibility 0s linear 2.6s;
  }
  #intro.open { opacity: 0; visibility: hidden; }
  .envelope { position: relative; width: min(520px, 86vw); aspect-ratio: 1.45; perspective: 1400px; }
  .env-back, .env-front, .env-flap, .env-card { position: absolute; left: 0; width: 100%; }
  .env-back {
    inset: 0; border-radius: 6px; background: var(--hot-pink);
    box-shadow: 0 30px 60px rgba(90, 0, 40, .35); overflow: hidden;
  }
  .env-back::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, #ff8fb5 0 14%, transparent 28%),
      radial-gradient(circle at 50% 18%, var(--orange) 0 10%, transparent 24%),
      radial-gradient(circle at 78% 34%, #ff4f8b 0 12%, transparent 26%),
      radial-gradient(circle at 35% 55%, var(--coral) 0 9%, transparent 22%),
      radial-gradient(circle at 65% 60%, #ffb3c9 0 12%, transparent 26%),
      #fff;
    filter: blur(2px) saturate(1.2);
  }
  .env-card {
    left: 6%; width: 88%; top: 8%; height: 84%;
    background: var(--cream); border: 3px solid var(--hot-pink);
    outline: 1px solid var(--orange); outline-offset: -9px;
    display: grid; place-items: center; text-align: center; padding: 1rem;
    transition: transform 1.1s cubic-bezier(.2,.8,.2,1) .6s; z-index: 2;
  }
  .env-card .script { font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; }
  .env-front {
    inset: 0; z-index: 3; pointer-events: none; background: var(--hot-pink);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); border-radius: 6px;
  }
  .env-flap { top: 0; height: 62%; z-index: 4; transform-origin: top center; transition: transform .8s ease, z-index 0s linear .4s; }
  .env-flap::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #ef4b8c, var(--hot-pink));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  #intro.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  #intro.open .env-card { transform: translateY(-58%); }
  .seal {
    position: absolute; left: 50%; top: 62%; z-index: 5; transform: translate(-50%, -50%);
    width: 86px; height: 86px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffb07a, var(--orange) 55%, #c9541f);
    box-shadow: 0 6px 16px rgba(0,0,0,.3), inset 0 -4px 8px rgba(0,0,0,.2);
    font-family: var(--script); font-size: 1.7rem; color: #fff6ee;
    animation: pulse 2s ease-in-out infinite; transition: opacity .3s;
  }
  #intro.open .seal { opacity: 0; pointer-events: none; }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.08); } }
  .intro-hint { position: absolute; bottom: 8vh; width: 100%; text-align: center; }
  .intro-hint .caps { color: #fff; }
  #gate { display: grid; justify-items: center; gap: .8rem; transition: opacity .4s; }
  #intro.open #gate { opacity: 0; pointer-events: none; }
  .gate-row { display: flex; gap: .5rem; }
  .gate-row input {
    width: min(220px, 50vw); padding: .7rem 1.2rem; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.15);
    color: #fff; font-family: var(--caps); letter-spacing: .2em; text-align: center; outline: none;
  }
  .gate-row input::placeholder { color: rgba(255,255,255,.7); }
  .gate-row input:focus { background: rgba(255,255,255,.25); border-color: #fff; }
  .gate-btn {
    padding: .7rem 1.4rem; border-radius: 999px; border: none; cursor: pointer;
    background: var(--orange); color: #fff;
    font-family: var(--caps); font-size: .7rem; letter-spacing: .25em; text-transform: uppercase;
  }
  .gate-error { min-height: 1em; color: #ffe1cf !important; }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

  /* ---------- Blooms & petals ---------- */
  .blooms { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .bloom {
    position: absolute; border-radius: 50%; filter: blur(30px); opacity: .4; mix-blend-mode: screen;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(40px, -30px) scale(1.15) rotate(25deg); } }
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .petal { position: absolute; top: -40px; border-radius: 150% 0 150% 0; opacity: .85; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .2; } }

  /* ---------- Save the date card ---------- */
  main { position: relative; z-index: 2; min-height: 100vh; display: grid; place-items: center; padding: 3rem 1.2rem; }
  .std {
    width: min(980px, 100%);
    display: grid; grid-template-columns: 1fr 1.05fr;
    background: var(--cream);
    border: 8px solid var(--cream);
    outline: 1.5px solid var(--gold); outline-offset: -20px;
    box-shadow: 0 50px 90px -30px rgba(80, 0, 30, .6);
    opacity: 0; transform: translateY(50px) rotate(-1deg);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .std.in { opacity: 1; transform: none; }
  .std-photo { position: relative; overflow: hidden; min-height: 420px; }
  .std-photo img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 65% center;
    transform: scale(1.12); transition: transform 3s ease;
  }
  .std.in .std-photo img { transform: scale(1); }
  .std-photo::after { /* soft pink wash at the seam */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 70%, rgba(253, 249, 243, .9));
  }
  .std-text { padding: clamp(2.5rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3.5rem); text-align: center; position: relative; }
  .std-text .save {
    font-family: var(--script); font-weight: 400; line-height: .9;
    font-size: clamp(3.6rem, 9vw, 5.6rem);
    background: linear-gradient(100deg, var(--hot-pink), var(--orange), var(--hot-pink));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
    padding: 0 .2em;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .std-text .names { font-size: clamp(1.8rem, 4.5vw, 2.5rem); line-height: 1.15; margin: 1.6rem 0 1.2rem; }
  .std-text .names .script { display: block; font-size: 1.7rem; }
  .bigdate {
    display: flex; justify-content: center; align-items: center; gap: 1rem;
    font-family: var(--display); color: var(--hot-pink); font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1;
  }
  .bigdate i { width: 1px; height: 2.6rem; background: var(--orange); }
  .std-text .when { margin-top: .9rem; line-height: 2.2; }
  .std-text .formal { font-style: italic; margin-top: 1.4rem; font-size: 1.15rem; }

  .countdown { display: flex; justify-content: center; gap: 1.4rem; margin-top: 1.4rem; }
  .countdown b { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1; color: var(--hot-pink); }
  .countdown span { font-family: var(--caps); font-size: .55rem; letter-spacing: .25em; text-transform: uppercase; color: var(--orange); }

  .actions { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; margin-top: 1.8rem; }
  .btn {
    display: inline-block; padding: .85rem 1.6rem;
    font-family: var(--caps); font-size: .64rem; letter-spacing: .22em; text-transform: uppercase;
    color: #fff; text-decoration: none; border: none; cursor: pointer;
    background: linear-gradient(110deg, var(--hot-pink), var(--orange)); background-size: 150% auto;
    border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(226, 51, 122, .6);
    transition: background-position .5s, transform .3s;
  }
  .btn:hover { background-position: right center; transform: translateY(-2px); }
  .btn.ghost { background: transparent; color: var(--hot-pink); border: 1.5px solid var(--hot-pink); box-shadow: none; }

  @media (max-width: 760px) {
    .std { grid-template-columns: 1fr; }
    .std-photo { min-height: 0; aspect-ratio: 4 / 3; }
    .std-photo::after { background: linear-gradient(180deg, transparent 70%, rgba(253, 249, 243, .9)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .std { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="locked">

<!-- ================= ENVELOPE INTRO ================= -->
<div id="intro">
  <div class="envelope">
    <div class="env-back"></div>
    <div class="env-card">
      <div>
        <p class="script">Save the Date</p>
        <p class="caps" style="margin-top:.4rem">Rachel &amp; Austin · 07.10.27</p>
      </div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" aria-label="Open save the date">R&amp;A</button>
  </div>
  <form class="intro-hint" id="gate" autocomplete="off">
    <label class="caps" for="code">Enter your access code to open</label>
    <div class="gate-row">
      <input id="code" name="code" type="password" placeholder="Access code" aria-describedby="gate-error" required />
      <button type="submit" class="gate-btn">Open</button>
    </div>
    <p class="caps gate-error" id="gate-error" role="alert"></p>
  </form>
</div>

<div class="blooms" data-blooms="10" aria-hidden="true"></div>
<div id="petals" aria-hidden="true"></div>

<!-- ================= SAVE THE DATE ================= -->
<main>
  <article class="std" id="std">
    <div class="std-photo">
      <img src="rachel-austin.png" alt="Rachel and Austin in a garden under blooming crepe myrtles" />
    </div>
    <div class="std-text">
      <h1 class="save">Save the Date</h1>
      <p class="caps" style="margin-top:.8rem">For the wedding of</p>
      <div class="names display">
        Rachel Odin
        <span class="script">and</span>
        Austin Malpede
      </div>
      <div class="bigdate"><span>07</span><i></i><span>10</span><i></i><span>27</span></div>
      <p class="caps when">Saturday, July 10, 2027<br/>Cincinnati, Ohio</p>
      <div class="countdown" aria-label="Countdown to the wedding">
        <div><b id="cd-days">0</b><span>Days</span></div>
        <div><b id="cd-hours">0</b><span>Hours</span></div>
        <div><b id="cd-mins">0</b><span>Min</span></div>
        <div><b id="cd-secs">0</b><span>Sec</span></div>
      </div>
      <p class="formal">Formal invitation to follow</p>
      <div class="actions">
        <a class="btn" id="gcal" target="_blank" rel="noopener">Google Calendar</a>
        <a class="btn ghost" id="ics" download="rachel-austin-wedding.ics">Apple / Outlook</a>
      </div>
    </div>
  </article>
</main>

<script>
  const WEDDING = new Date("2027-07-10T17:30:00-04:00");
  const PALETTE = ["#e2337a", "#f2763a", "#f7b8cb", "#f59a6b", "#ff4f8b", "#ffb3c9"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // Envelope intro, gated by access code. Note: this is a soft gate — the page
  // source is still public to anyone who views it.
  const ACCESS_CODE = "thea710";
  const gate = document.getElementById("gate");
  const codeInput = document.getElementById("code");
  const gateError = document.getElementById("gate-error");
  if (localStorage.getItem("ra-access") === ACCESS_CODE) codeInput.value = ACCESS_CODE;

  function tryOpen() {
    if (codeInput.value.trim().toLowerCase() !== ACCESS_CODE) {
      gateError.textContent = codeInput.value ? "That code isn't quite right" : "Please enter your access code";
      gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
      codeInput.focus();
      return;
    }
    localStorage.setItem("ra-access", ACCESS_CODE);
    document.getElementById("intro").classList.add("open");
    setTimeout(() => {
      document.body.classList.remove("locked");
      document.getElementById("std").classList.add("in");
      burst(50);
    }, 1500);
  }
  gate.addEventListener("submit", e => { e.preventDefault(); tryOpen(); });
  document.getElementById("seal").addEventListener("click", tryOpen);

  // Watercolor blooms
  document.querySelectorAll(".blooms").forEach(el => {
    for (let i = 0; i < +el.dataset.blooms; i++) {
      const b = document.createElement("div");
      b.className = "bloom";
      const size = rand(160, 420);
      Object.assign(b.style, {
        width: size + "px", height: size * rand(.7, 1.1) + "px",
        left: rand(-10, 95) + "%", top: rand(-10, 90) + "%",
        background: `radial-gradient(circle at 40% 40%, ${pick(PALETTE)}, transparent 70%)`,
        animationDelay: -rand(0, 18) + "s",
        animationDuration: rand(14, 24) + "s",
      });
      el.appendChild(b);
    }
  });

  // Falling petals
  const petals = document.getElementById("petals");
  function petal() {
    const p = document.createElement("span");
    p.className = "petal";
    const s = rand(8, 18), dur = rand(7, 13);
    Object.assign(p.style, {
      width: s + "px", height: s + "px", left: rand(0, 100) + "vw",
      background: pick(PALETTE.concat("#fff", "#fff")), animationDuration: dur + "s",
    });
    p.style.setProperty("--dx", rand(-150, 150) + "px");
    p.style.setProperty("--rot", rand(-720, 720) + "deg");
    petals.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000);
  }
  function burst(n) { for (let i = 0; i < n; i++) setTimeout(petal, i * 60); }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(petal, 900);

  // Countdown
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.max(0, WEDDING - new Date()) / 1000;
    const d = Math.floor(diff / 86400); diff %= 86400;
    const h = Math.floor(diff / 3600); diff %= 3600;
    document.getElementById("cd-days").textContent = d;
    document.getElementById("cd-hours").textContent = pad(h);
    document.getElementById("cd-mins").textContent = pad(Math.floor(diff / 60));
    document.getElementById("cd-secs").textContent = pad(Math.floor(diff % 60));
  }
  tick(); setInterval(tick, 1000);

  // Add-to-calendar links (all-day event)
  const title = "Rachel & Austin's Wedding";
  const details = "Save the date! Formal invitation to follow.";
  const where = "Cincinnati, Ohio";
  document.getElementById("gcal").href =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(title) +
    "&dates=20270710/20270711" +
    "&details=" + encodeURIComponent(details) +
    "&location=" + encodeURIComponent(where);
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//RachelAustin//SaveTheDate//EN",
    "BEGIN:VEVENT", "UID:rachel-austin-20270710@wedding",
    "DTSTAMP:20261104T000000Z",
    "DTSTART;VALUE=DATE:20270710", "DTEND;VALUE=DATE:20270711",
    "SUMMARY:" + title, "DESCRIPTION:" + details, "LOCATION:" + where,
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  document.getElementById("ics").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
</script>
</body>
</html>
